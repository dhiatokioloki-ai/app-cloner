
name: Build ModKit CloneKit APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project and install APK tool
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f -name settings.gradle \
            -not -path '*/third_party/*' \
            -print -quit | sed 's|/settings.gradle$||')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find the Android project."
            echo "Upload the extracted project files to this repository."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"
          sh scripts/setup-apktool.sh

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModKit-CloneKit-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

